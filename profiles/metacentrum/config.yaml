# Snakemake profile for MetaCentrum — single large node
# Submit with: qsub run_metacentrum.sh
# Or interactively after qsub -I: snakemake --profile profiles/metacentrum

software-deployment-method: conda

# All hardware settings (cores, memory, scratch) are set in run_metacentrum.sh
# together with the PBS directives so everything stays in one place.
